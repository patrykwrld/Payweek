ext {
    // 24, not 23, because Play's automatic protection — the anti-tamper
    // wrapper applied server-side at release — refuses a bundle below 24 and
    // blocks the upload. API 23 is Android 6.0, under half a percent of
    // devices in the UK, and Capacitor 6 itself only needs 22. Nothing in the
    // app uses an API between the two.
    minSdkVersion = 24
    // Play's floor moves every August. From 31 Aug 2026 an app targeting below
    // API 36 cannot be updated at all — not rejected, simply frozen. Check the
    // current floor before each submission:
    // https://developer.android.com/google/play/requirements/target-sdk
    //
    // 36 needs AGP 8.9+, which needs Gradle 8.11.1+. All four move together;
    // see the note in build.gradle.
    compileSdkVersion = 36
    targetSdkVersion = 36
    androidxActivityVersion = '1.9.3'
    androidxAppCompatVersion = '1.7.0'
    androidxCoordinatorLayoutVersion = '1.2.0'
    androidxCoreVersion = '1.15.0'
    androidxFragmentVersion = '1.8.5'
    coreSplashScreenVersion = '1.0.1'
    androidxWebkitVersion = '1.12.1'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.1.5'
    androidxEspressoCoreVersion = '3.5.1'
    cordovaAndroidVersion = '10.1.1'
}