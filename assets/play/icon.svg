<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!--
    Payweek app icon — the source the 512x512 PNG is rendered from.

    Three ascending bars ending in a pound: the week building up, finishing in
    money. It replaced a five-bar chart whose two darkest bars vanished into
    the background at launcher size, so it read as three bars and said
    "analytics" rather than "pay".
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#18212e"/>
      <stop offset="1" stop-color="#090d12"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.46" r="0.52">
      <stop offset="0" stop-color="#5e9bff" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#5e9bff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Full bleed, no transparency. Play requires the square filled and
       applies its own corner masking. -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#glow)"/>

  <!-- Centred on the mark's own bounding box, not the drawing's origin, and
       scaled to fill ~72% of the canvas: confident without fouling the corner
       masking Play and Android both apply. -->
  <g transform="translate(256,256) scale(1.08) translate(-266.5,-263)">

    <!-- Three bars, not five. Four elements is the most that survives 48px.
         The darkest is #4a6da8 — anything darker disappears into the ground. -->
    <g stroke-linecap="round" stroke-width="44" fill="none">
      <path d="M118 362 V 300" stroke="#4a6da8"/>
      <path d="M186 362 V 254" stroke="#5486d6"/>
      <path d="M254 362 V 208" stroke="#5e9bff"/>
    </g>

    <!-- The pound carries the same weight as a bar and stands tallest, so the
         sequence reads as one idea rather than a chart with a symbol beside
         it. White against the blues makes it the hero. -->
    <g stroke="#eef3f8" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M398 214 C 398 182, 376 164, 350 164 C 326 164, 314 184, 314 214 L 314 362"
            stroke-width="42"/>
      <path d="M300 286 H 380" stroke-width="34"/>
      <path d="M300 362 H 416" stroke-width="42"/>
    </g>

  </g>
</svg>
